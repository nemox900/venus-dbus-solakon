# Standardwerte des Solakon-Mods. Nicht hier aendern, sondern in config.ini
# (wird bei Updates des Mods nicht ueberschrieben).

[solakon]
# Solakon ONE, Modbus-TCP (WLAN/LAN-Stick WF2000M)
host =
port = 502
unit = 1

[powertracker]
# Solakon PowerTracker IR (Lesekopf am Hauszaehler), HTTP-API
host =

[control]
# 0 = nur lesen (Hersteller-App steuert), 1 = Venus steuert den Speicher.
# Bei 1 nimmt der Treiber ESS-Modus, Netz-Sollwert, Ladezeitplaene, Dynamic ESS
# und Ladegrenzen von Venus an und schreibt sie per Modbus ins Solakon.
enabled = 0
